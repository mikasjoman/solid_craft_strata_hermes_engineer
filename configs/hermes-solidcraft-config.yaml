# Sanitized Hermes Agent profile config for SolidCraft CAD (~/.hermes/profiles/solidcraft/config.yaml)
# Preset A: Local-First (Strata builds 95%+ at $0, OpenAI gpt-6.2-sol does visual QA & 2-strike deadlocks).
# Replace <STRATA_HOST> with your Strata server IP/hostname (e.g. 192.168.1.x).

model:
  default: qwen3.8-flash-next-ud-q4_k_xl
  provider: strata
  base_url: http://<STRATA_HOST>:8086/v1
  supports_vision: true

agent:
  max_turns: 500
  reasoning_effort: medium
  image_input_mode: native

tools:
  tool_search:
    enabled: "off"   # CRITICAL: eliminates deferred tool_call proxy failures (86.7% -> 0%)

compression:
  enabled: true
  threshold: 0.82
  target_ratio: 0.15
  protect_last_n: 12
  protect_first_n: 2
  idle_compact_after_seconds: 1800
  proactive_prune_tokens: 65536
  proactive_prune_min_result_chars: 4000
  proactive_prune_min_reclaim_tokens: 8192

delegation:
  # Option 1 (Local-first, ~$0.10-$0.50/project):
  #   model = strata, delegation = openai-api (Phase 0 spec + 2-strike surgeon)
  # Option 2 (Manager-Worker, ~$0.50-$1.20/project, ~10x faster wall-clock):
  #   model = openai-api (gpt-6.2-sol), delegation = strata (local V100 workers)
  backend: hybrid
  provider: strata
  model: qwen3.8-flash-next-ud-q4_k_xl
  base_url: http://<STRATA_HOST>:8086/v1
  reasoning_effort: medium
  max_concurrent_children: 1   # Matches Strata --parallel 2 (1 parent + 1 child = 0 GPU queuing)
  max_iterations: 30           # Prevents runaway 20-45 min subagents
  subagent_auto_approve: true
  independent_completions: false  # Set true in Hermes Desktop; false in SolidCraft ACP

providers:
  strata:
    base_url: http://<STRATA_HOST>:8086/v1
    api_key: sk-strata
    context_length: 131072
    extra_body:
      max_tokens: 16384        # NEVER set reasoning_budget_tokens: 1024 here!

auxiliary:
  vision:
    provider: openai-api
    model: gpt-6.2-sol         # Strong visual critic (~$0.01/image); NEVER use a 9B VLM for CAD QA
    timeout: 120
  review:
    provider: openai-api
    model: gpt-6.2-sol
  compression:
    provider: strata
    model: qwen3.8-flash-next-ud-q4_k_xl
    reasoning_effort: none     # Prevents 70s silent thinking stalls during thread summarization
    context_length: 131072

mcp_servers:
  solidcraft-live:
    command: ~/.local/bin/solidcraft-cli
    args: ["mcp", "--connect", "127.0.0.1:27878", "--compact", "--param-check", "strict"]
    enabled: true
