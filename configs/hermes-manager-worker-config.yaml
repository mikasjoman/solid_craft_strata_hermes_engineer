# Sanitized Hermes Agent profile config — Preset B: OpenAI Manager -> Local Strata Workers
# Estimated cost: ~$0.50-$1.20 per complex multi-stage CAD assembly (~10x faster wall-clock than all-local).
# OpenAI (gpt-6.2-sol) plans coordinates, dispatches small part tasks, and runs visual QA.
# Local Strata (Qwen3.8-Flash-Next @ 80-117 tok/s, $0) does all Python CAD coding, oracle loops & FEA.
# Replace <STRATA_HOST> with your Strata server IP/hostname (e.g. 192.168.1.x).

model:
  default: gpt-6.2-sol
  provider: openai-api
  supports_vision: true

agent:
  max_turns: 300
  reasoning_effort: medium
  image_input_mode: native

tools:
  tool_search:
    enabled: "off"

compression:
  enabled: true
  threshold: 0.82
  target_ratio: 0.15
  protect_last_n: 12
  protect_first_n: 2
  idle_compact_after_seconds: 1800
  proactive_prune_tokens: 65536
  proactive_prune_min_result_chars: 4000
  proactive_prune_min_reclaim_tokens: 8192

delegation:
  provider: strata
  model: qwen3.8-flash-next-ud-q4_k_xl
  base_url: http://<STRATA_HOST>:8086/v1
  reasoning_effort: medium
  max_concurrent_children: 1    # Matches Strata --parallel 2 cleanly
  max_iterations: 12            # Hard cap prevents runaway subagents
  subagent_auto_approve: true
  independent_completions: true # Best in Hermes Desktop; set false in SolidCraft ACP

providers:
  strata:
    base_url: http://<STRATA_HOST>:8086/v1
    api_key: sk-strata
    context_length: 131072
    extra_body:
      max_tokens: 16384

auxiliary:
  vision:
    provider: openai-api
    model: gpt-6.2-sol
    timeout: 120
  review:
    provider: openai-api
    model: gpt-6.2-sol
  compression:
    provider: strata
    model: qwen3.8-flash-next-ud-q4_k_xl
    reasoning_effort: none
    context_length: 131072

mcp_servers:
  solidcraft-live:
    command: ~/.local/bin/solidcraft-cli
    args: ["mcp", "--connect", "127.0.0.1:27878", "--compact", "--param-check", "strict"]
    enabled: true
